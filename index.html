<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System 404</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --glow: #00ffcc; --red: #ff4444; --bg: #050505; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { height: 100vh; margin: 0; background: #000; color: #444; font-family: monospace; overflow: hidden; }
        
        #fake-ui { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #secret-ui { display: none; flex-direction: column; height: 100%; padding: 10px; background: var(--bg); }

        /* Online Status Bar */
        #status-bar { font-size: 0.65rem; padding: 5px; color: #666; border-bottom: 1px solid #111; margin-bottom: 5px; }
        .online { color: var(--glow); }

        #chat-box { flex: 1; overflow-y: auto; border-left: 2px solid var(--glow); padding: 10px; font-size: 0.8rem; margin-bottom: 10px; color: #ccc; }
        .msg { margin-bottom: 8px; border-bottom: 1px solid #111; padding-bottom: 4px; }
        .u-tag { color: var(--glow); font-weight: bold; }
        
        /* Audio Player Styling */
        .audio-msg { background: #111; padding: 5px; border-radius: 4px; margin-top: 5px; display: inline-block; border: 1px solid #333; }
        .audio-msg button { padding: 4px 10px; background: none; border: 1px solid var(--glow); color: var(--glow); font-size: 0.6rem; cursor: pointer; }

        .row { display: flex; gap: 5px; margin-bottom: 8px; }
        input { flex: 1; background: #111; border: 1px solid #222; color: white; padding: 12px; font-size: 0.8rem; border-radius: 4px; }
        button { background: #111; border: 1px solid var(--glow); color: var(--glow); padding: 10px; font-weight: bold; border-radius: 4px; font-size: 0.7rem; }

        .haptic-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; }
        
        #v-area { background: #111; padding: 10px; border-radius: 8px; text-align: center; position: relative; }
        #v-btn { width: 100%; color: var(--red); border-color: var(--red); }
        .preview-box { display: none; gap: 5px; width: 100%; }
        .preview-box button { flex: 1; }

        #id-tag { font-size: 0.6rem; text-align: center; color: #333; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="fake-ui" onclick="unlock()">
        <h1>404</h1>
        <p>Protocol Error</p>
    </div>

    <div id="secret-ui">
        <div id="status-bar">PARTNER: <span id="p-status">OFFLINE</span></div>
        <div id="chat-box">-- TAP SCREEN ONCE TO ENABLE VIBRATIONS --</div>

        <div class="row">
            <input type="text" id="target" placeholder="6-digit ID">
            <button onclick="connectToPeer()">LINK</button>
        </div>

        <div class="row">
            <input type="text" id="m-in" placeholder="Message...">
            <button onclick="sendText()">SEND</button>
        </div>

        <div class="haptic-grid">
            <button onclick="sendHap('yes')">YES</button>
            <button onclick="sendHap('no')">NO</button>
            <button onclick="sendHap('alert')" style="color:var(--red); border-color:var(--red);">ALERT</button>
        </div>

        <div id="v-area">
            <button id="v-btn" onclick="startRec()">TAP TO RECORD (5s)</button>
            <div id="preview-box" class="preview-box">
                <button onclick="playLocal()">PREVIEW</button>
                <button onclick="sendVoice()" style="background:var(--glow); color:black;">SEND VOICE</button>
                <button onclick="resetRec()">X</button>
            </div>
        </div>

        <div id="id-tag">MY ID: <span id="my-id" style="color:#666">...</span></div>
    </div>

    <script>
        let peer, conns = [], myName = "", audioData = null, rec, chunks = [], clicks = 0;
        const hapLib = { 'yes': [200, 100, 200], 'no': [500], 'alert': [100, 50, 100, 50, 100, 50, 500] };

        // 1. Generate short 6-character ID
        const shortID = Math.random().toString(36).substring(2, 8).toUpperCase();

        function unlock() {
            if (++clicks >= 3) {
                // REQUIRED: User interaction "unlocks" vibration/audio for the session
                navigator.vibrate(50); 
                myName = prompt("Display Name:") || "Ghost";
                document.getElementById('fake-ui').style.display = 'none';
                document.getElementById('secret-ui').style.display = 'flex';
                initPeer();
            }
        }

        function initPeer() {
            peer = new Peer(shortID, { config: {'iceServers': [{url:'stun:stun.l.google.com:19302'}]} });
            peer.on('open', id => document.getElementById('my-id').innerText = id);
            peer.on('connection', c => setup(c));
            
            // Online status heartbeat
            setInterval(() => {
                const status = conns.some(c => c.open) ? "ONLINE" : "OFFLINE";
                const el = document.getElementById('p-status');
                el.innerText = status;
                el.className = status === "ONLINE" ? "online" : "";
            }, 3000);
        }

        function connectToPeer() {
            const id = document.getElementById('target').value.toUpperCase();
            if(id) setup(peer.connect(id));
        }

        function setup(c) {
            c.on('open', () => { 
                conns.push(c); 
                log("SYSTEM", "LINK ACTIVE"); 
            });
            c.on('data', d => {
                if (d.t === 'txt') log(d.n, d.v);
                if (d.t === 'hap') { 
                    navigator.vibrate(hapLib[d.v]); 
                    log(d.n, `[Haptic Signal: ${d.v}]`); 
                }
                if (d.t === 'voc') {
                    // Create a playable button for the received voice
                    const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const id = "aud_" + Date.now();
                    log(d.n, `Voice Note <div class="audio-msg"><button onclick="playReceived('${id}')">PLAY AUDIO</button></div><audio id="${id}" src="${d.v}"></audio>`);
                }
            });
        }

        function log(n, m) {
            const b = document.getElementById('chat-box');
            b.innerHTML += `<div class="msg"><span class="u-tag">[${n}]</span> ${m}</div>`;
            b.scrollTop = b.scrollHeight;
        }

        function sendText() {
            const val = document.getElementById('m-in').value;
            if(!val) return;
            broadcast({t:'txt', v:val, n:myName});
            log("ME", val);
            document.getElementById('m-in').value = "";
        }

        function sendHap(type) {
            broadcast({t:'hap', v:type, n:myName});
            navigator.vibrate(hapLib[type]);
        }

        // Voice Recording Logic
        async function startRec() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            rec = new MediaRecorder(stream, { mimeType: 'audio/webm', audioBitsPerSecond: 16000 });
            chunks = [];
            rec.ondataavailable = e => chunks.push(e.data);
            rec.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const r = new FileReader();
                r.onload = () => {
                    audioData = r.result;
                    document.getElementById('v-btn').style.display = "none";
                    document.getElementById('preview-box').style.display = "flex";
                };
                r.readAsDataURL(blob);
            };
            rec.start();
            document.getElementById('v-btn').innerText = "RECORDING (05s)...";
            setTimeout(() => { if(rec.state === "recording") rec.stop(); }, 5000);
        }

        function playLocal() { if(audioData) new Audio(audioData).play(); }
        function playReceived(id) { document.getElementById(id).play(); }
        
        function sendVoice() {
            broadcast({t:'voc', v:audioData, n:myName});
            log("ME", "[Voice Sent]");
            resetRec();
        }

        function resetRec() {
            audioData = null;
            document.getElementById('v-btn').style.display = "block";
            document.getElementById('v-btn').innerText = "TAP TO RECORD (5s)";
            document.getElementById('preview-box').style.display = "none";
        }

        function broadcast(d) { conns.forEach(c => { if(c.open) c.send(d); }); }
    </script>
</body>
</html>
