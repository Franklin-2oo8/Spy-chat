<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHANTOM MESH v9.5</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --glow: #00ffcc; --red: #ff4444; --bg: #050505; --panel: #111; --blue: #5d5df5; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { height: 100svh; background: #000; color: #ccc; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Status UI */
        #status-bar { font-size: 0.7rem; padding: 10px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; background: #080808; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; background: #333; margin-right: 5px; transition: 0.3s; }
        .online { background: var(--glow); box-shadow: 0 0 8px var(--glow); }

        #chat-box { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.85rem; background: #000; border-left: 1px solid #1a1a1a; }
        .msg { margin-bottom: 12px; position: relative; padding: 10px; background: #0a0a0a; border-radius: 6px; border: 1px solid #151515; }
        .tick { font-size: 0.6rem; color: #444; float: right; margin-top: 4px; font-weight: bold; }
        .delivered { color: var(--glow) !important; }

        /* Controls */
        .controls { padding: 10px; background: #080808; display: flex; flex-direction: column; gap: 8px; }
        .row { display: flex; gap: 8px; width: 100%; }
        input { flex: 1; background: var(--panel); border: 1px solid #222; color: white; padding: 12px; border-radius: 6px; outline: none; font-size: 0.9rem; }
        button { background: var(--panel); border: 1px solid var(--glow); color: var(--glow); padding: 10px; font-weight: bold; border-radius: 6px; font-size: 0.7rem; }
        
        /* Visualizer Area */
        #v-area { background: #0d0d0d; border-radius: 8px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 1px solid #333; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.4; pointer-events: none; }
        #timer { font-family: monospace; font-size: 1.2rem; color: var(--red); z-index: 2; font-weight: bold; display:none; }

        /* Call Screen */
        #call-ui { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="status-bar">
        <span><span id="p-dot" class="dot"></span> <span id="p-stat">OFFLINE</span></span>
        <span id="my-id">INITIALIZING...</span>
    </div>

    <div id="chat-box">-- SECURE BOOT COMPLETE --</div>

    <div id="call-ui">
        <h2 id="call-label" style="color:var(--blue); margin-bottom: 30px;">INCOMING CALL</h2>
        <div class="row" style="justify-content:center; gap:20px;">
            <button id="ans-btn" style="background:var(--glow); color:#000; padding:20px 40px; display:none" onclick="acceptCall()">ANSWER</button>
            <button style="background:var(--red); color:#fff; border:none; padding:20px 40px;" onclick="endCall()">HANG UP</button>
        </div>
    </div>

    <div class="controls">
        <div class="row"><input type="text" id="target" placeholder="Target Peer ID"><button onclick="connect()">LINK</button></div>
        <div class="row"><input type="text" id="m-in" placeholder="Message..."><button onclick="sendText()">SEND</button></div>
        <div class="row">
            <button onclick="startCall()" style="flex:2; color:var(--blue); border-color:var(--blue)">HD VOICE CALL</button>
            <button onclick="document.getElementById('f-in').click()">IMG</button>
        </div>
        <input type="file" id="f-in" style="display:none" onchange="sendImg(this)">

        <div id="v-area">
            <canvas id="v-canvas"></canvas>
            <button id="rec-btn" style="width:100%; height:50px;" onclick="startRec()">VOICE NOTE (60s)</button>
            <div id="rec-active-ui" style="display:none; z-index:2; gap:10px; align-items:center;">
                <div id="timer">00:00</div>
                <button id="pause-rec-btn" onclick="togglePauseRec()">PAUSE</button>
                <button onclick="stopRec()" style="background:var(--red); color:white; border:none;">DONE</button>
            </div>
            <div id="post-rec" style="display:none; z-index:2; gap:10px; padding:5px; width:100%">
                <button id="pre-play" onclick="togglePreview()" style="flex:1">PLAY</button>
                <button onclick="sendVoice()" style="background:var(--glow); color:#000; border:none; flex:2">SEND</button>
                <button onclick="resetRecUI()" style="flex:0.5">X</button>
            </div>
        </div>
    </div>

    <script>
        let peer, conns = [], myId, rec, chunks = [], curCall, localStream, audioData, preview = new Audio();
        let seconds = 0, timerInt, audioCtx, ringtoneOsc;

        myId = localStorage.getItem('p_id') || Math.random().toString(36).substr(2,6).toUpperCase();
        localStorage.setItem('p_id', myId);
        peer = new Peer(myId, { config: {'iceServers': [{url:'stun:stun.l.google.com:19302'}]} });
        peer.on('open', id => document.getElementById('my-id').innerText = "MY ID: " + id);
        
        peer.on('connection', c => setupConn(c));
        peer.on('call', call => {
            curCall = call;
            document.getElementById('call-ui').style.display='flex';
            document.getElementById('call-label').innerText = "INCOMING CALL...";
            document.getElementById('ans-btn').style.display='block';
            playRing(true);
        });

        function connect() {
            const id = document.getElementById('target').value.toUpperCase();
            if(id) setupConn(peer.connect(id));
        }

        function setupConn(c) {
            c.on('open', () => {
                if(!conns.find(conn => conn.peer === c.peer)) conns.push(c);
                log("SYS", "LINK ESTABLISHED");
                setInterval(() => c.send({t:'hb'}), 2000);
            });
            c.on('data', d => {
                if(d.t==='hb') updateStatus();
                if(d.t==='txt') { log(d.n, d.v, d.id); c.send({t:'ack', id:d.id}); }
                if(d.t==='ack') { 
                    const t = document.getElementById('tk-'+d.id);
                    if(t) { t.innerText="DELIVERED"; t.classList.add('delivered'); }
                }
                if(d.t==='voc') renderAudio(d.n, d.v, d.id);
            });
        }

        // --- IMPROVED RINGTONE ---
        function playRing(isIncoming) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            ringtoneOsc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            ringtoneOsc.type = isIncoming ? 'sine' : 'triangle';
            ringtoneOsc.frequency.setValueAtTime(isIncoming ? 440 : 660, audioCtx.currentTime);
            // Pulse effect
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.1);
            ringtoneOsc.connect(gain);
            gain.connect(audioCtx.destination);
            ringtoneOsc.start();
        }

        function stopRing() { if(ringtoneOsc) { ringtoneOsc.stop(); ringtoneOsc = null; } }

        // --- CALLS ---
        async function startCall() {
            const id = document.getElementById('target').value.toUpperCase();
            if(!id) return;
            document.getElementById('call-ui').style.display='flex';
            document.getElementById('call-label').innerText = "DIALING...";
            playRing(false);
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            curCall = peer.call(id, localStream, { sdpTransform: sdp => sdp.replace("useinbandfec=1", "useinbandfec=1;stereo=1;maxaveragebitrate=128000") });
            curCall.on('stream', s => { stopRing(); playStream(s); document.getElementById('call-label').innerText = "CONNECTED"; });
        }

        async function acceptCall() {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            curCall.answer(localStream);
            stopRing();
            document.getElementById('ans-btn').style.display='none';
            document.getElementById('call-label').innerText = "CONNECTED";
            curCall.on('stream', s => playStream(s));
        }

        function endCall() {
            if(curCall) curCall.close();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            stopRing();
            document.getElementById('call-ui').style.display='none';
        }

        function playStream(s) { const a = new Audio(); a.srcObject=s; a.play(); }

        // --- VOICE NOTES ---
        async function startRec() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            startVis(stream);
            rec = new MediaRecorder(stream);
            chunks = [];
            rec.ondataavailable = e => chunks.push(e.data);
            rec.onstop = () => {
                audioData = URL.createObjectURL(new Blob(chunks, {type:'audio/webm'}));
                preview.src = audioData;
                document.getElementById('post-rec').style.display='flex';
                document.getElementById('rec-active-ui').style.display='none';
                stream.getTracks().forEach(t=>t.stop());
            };
            rec.start();
            document.getElementById('rec-btn').style.display='none';
            document.getElementById('rec-active-ui').style.display='flex';
            document.getElementById('timer').style.display='block';
            startTimer();
        }

        function togglePauseRec() {
            const btn = document.getElementById('pause-rec-btn');
            if(rec.state === 'recording') { rec.pause(); clearInterval(timerInt); btn.innerText = "RESUME"; }
            else { rec.resume(); startTimer(); btn.innerText = "PAUSE"; }
        }

        function stopRec() { rec.stop(); clearInterval(timerInt); }

        function togglePreview() {
            const b = document.getElementById('pre-play');
            if(preview.paused) { preview.play(); b.innerText="PAUSE"; }
            else { preview.pause(); b.innerText="PLAY"; }
            preview.onended = () => b.innerText="PLAY";
        }

        function resetRecUI() {
            document.getElementById('post-rec').style.display='none';
            document.getElementById('rec-btn').style.display='block';
            seconds = 0;
            document.getElementById('timer').innerText = "00:00";
        }

        async function sendVoice() {
            const blob = await fetch(audioData).then(r=>r.blob());
            const reader = new FileReader();
            reader.onload = () => {
                const id = Date.now();
                conns.forEach(c => c.send({t:'voc', v:reader.result, n:'ME', id:id}));
                renderAudio('ME', reader.result, id);
                resetRecUI();
            };
            reader.readAsDataURL(blob);
        }

        function renderAudio(n, v, id) {
            const mid = "a"+id;
            log(n, `<button onclick="toggleMsgAud('${mid}')" id="btn-${mid}" style="padding:8px">PLAY VOICE NOTE</button><audio id="${mid}" src="${v}"></audio>`, id);
        }

        window.toggleMsgAud = (id) => {
            const a = document.getElementById(id);
            const b = document.getElementById('btn-'+id);
            if(a.paused) { a.play(); b.innerText="PAUSE"; }
            else { a.pause(); b.innerText="PLAY"; }
            a.onended = () => b.innerText="PLAY VOICE NOTE";
        }

        // --- SYSTEM UTILS ---
        function log(n, m, id) {
            const b = document.getElementById('chat-box');
            const tk = id ? `<span class="tick" id="tk-${id}">SENT</span>` : "";
            b.innerHTML += `<div class="msg"><b style="color:var(--glow)">${n}:</b> ${m}${tk}</div>`;
            b.scrollTop = b.scrollHeight;
        }

        function sendText() {
            const v = document.getElementById('m-in').value;
            if(!v) return;
            const id = Date.now();
            conns.forEach(c => c.send({t:'txt', v:v, n:'ME', id:id}));
            log("ME", v, id);
            document.getElementById('m-in').value="";
        }

        let lastHb;
        function updateStatus() {
            document.getElementById('p-dot').classList.add('online');
            document.getElementById('p-stat').innerText = "ONLINE";
            clearTimeout(lastHb);
            lastHb = setTimeout(() => {
                document.getElementById('p-dot').classList.remove('online');
                document.getElementById('p-stat').innerText = "OFFLINE";
            }, 5000);
        }

        function startTimer() {
            timerInt = setInterval(() => {
                seconds++;
                document.getElementById('timer').innerText = `00:${seconds.toString().padStart(2,'0')}`;
                if(seconds >= 60) stopRec();
            }, 1000);
        }

        function startVis(s) {
            const canvas = document.getElementById('v-canvas');
            const ctx = canvas.getContext('2d');
            const ac = new (window.AudioContext || window.webkitAudioContext)();
            const src = ac.createMediaStreamSource(s);
            const ana = ac.createAnalyser();
            src.connect(ana);
            const data = new Uint8Array(ana.frequencyBinCount);
            function draw() {
                requestAnimationFrame(draw);
                ana.getByteFrequencyData(data);
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#00ffcc';
                for(let i=0; i<data.length; i+=5) ctx.fillRect(i, 60, 3, -data[i]/3);
            }
            draw();
        }
    </script>
</body>
</html>
