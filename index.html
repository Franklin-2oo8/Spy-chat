<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System 404</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --glow: #00ffcc; --red: #ff4444; --bg: #050505; --panel: #111; --blue: #5d5df5; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { height: 100svh; background: #000; color: #ccc; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        #secret-ui { display: flex; flex-direction: column; height: 100svh; width: 100%; background: var(--bg); padding: 8px; }
        #chat-box { flex: 1; overflow-y: auto; border-left: 2px solid var(--glow); padding: 10px; font-size: 0.85rem; background: #000; margin: 5px 0; }
        .msg { margin-bottom: 12px; border-bottom: 1px solid #111; padding-bottom: 6px; }
        .u-tag { color: var(--glow); font-weight: bold; }

        .controls { display: flex; flex-direction: column; gap: 5px; }
        .row { display: flex; gap: 5px; width: 100%; }
        input { flex: 1; background: var(--panel); border: 1px solid #222; color: white; padding: 12px; border-radius: 6px; outline: none; font-size: 0.9rem; }
        button { background: var(--panel); border: 1px solid var(--glow); color: var(--glow); padding: 10px; font-weight: bold; border-radius: 6px; font-size: 0.7rem; }

        /* Recording Panel & Visualizer */
        #v-area { background: var(--panel); border-radius: 8px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 5px; border: 1px solid #222; position: relative; overflow: hidden; }
        #v-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.3; pointer-events: none; display: none; }
        
        #timer { font-family: monospace; font-size: 1.2rem; color: var(--red); display: none; z-index: 2; font-weight: bold; }
        #rec-controls { display: none; gap: 10px; width: 100%; padding: 10px; z-index: 2; }
        
        /* Message Audio Player */
        .audio-player { background: #1a1a1a; padding: 8px; border-radius: 5px; display: flex; align-items: center; gap: 10px; margin-top: 5px; width: fit-content; border: 1px solid #333; }
        .play-btn { background: var(--glow); color: black; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; }
    </style>
</head>
<body>

    <div id="secret-ui">
        <div id="chat-box">-- HD MESH v7.5 ACTIVE --</div>

        <div class="controls">
            <div class="row"><input type="text" id="target" placeholder="Partner ID"><button onclick="connectToPeer()">LINK</button></div>
            <div class="row"><input type="text" id="m-in" placeholder="Message..."><button onclick="sendText()">SEND</button></div>
            
            <div class="row">
                <button onclick="sendHap('alert')" style="color:var(--red); border-color:var(--red)">PANIC</button>
                <button onclick="startCall()" style="color:var(--blue); border-color:var(--blue); flex:2">HD VOICE CALL</button>
                <button onclick="document.getElementById('file-in').click()">IMG</button>
            </div>
            <input type="file" id="file-in" accept="image/*" style="display:none" onchange="sendImg(this)">

            <div id="v-area">
                <canvas id="v-canvas"></canvas>
                <button id="v-start-btn" style="width:100%; height:50px;" onclick="startRec()">VOICE NOTE (60s)</button>
                <div id="timer">00:00</div>
                <div id="rec-controls">
                    <button id="pause-rec-btn" onclick="togglePauseRec()" style="flex:1">PAUSE</button>
                    <button onclick="stopRec()" style="flex:1; background:var(--red); color:white; border:none;">STOP</button>
                </div>
                <div id="preview-box" style="display:none; gap:5px; padding:5px; width:100%; z-index:2;">
                    <button id="preview-play-btn" onclick="togglePreviewPlay()" style="flex:1">PLAY PREVIEW</button>
                    <button onclick="sendVoice()" style="flex:1; background:var(--glow); color:black; border:none">SEND</button>
                    <button onclick="resetRec()" style="flex:0.3">X</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let peer, conns = [], myName = "User", rec, chunks = [], currentCall, localStream;
        let audioData = null, previewAudio = new Audio(), timerInt, seconds = 0;
        let audioCtx, analyser, dataArray, animationId;

        // Auto-unlock for quick testing
        const savedID = localStorage.getItem('phantom_id') || Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('phantom_id', savedID);
        peer = new Peer(savedID);
        peer.on('open', id => document.getElementById('chat-box').innerHTML += `<div>YOUR ID: ${id}</div>`);
        peer.on('connection', c => setup(c));
        peer.on('call', call => { if(confirm("Answer HD Voice?")) answerCall(call); });

        function setup(c) {
            c.on('open', () => { conns.push(c); log("SYSTEM", "LINKED"); });
            c.on('data', d => {
                if (d.t === 'txt') log(d.n, d.v);
                if (d.t === 'img') log(d.n, `<br><img src="${d.v}" style="max-width:200px">`);
                if (d.t === 'voc') renderAudioMsg(d.n, d.v);
            });
        }

        // --- HD VOICE CALL ---
        async function startCall() {
            const tid = document.getElementById('target').value.toUpperCase();
            localStream = await navigator.mediaDevices.getUserMedia({ audio: { autoGainControl: false, noiseSuppression: true, echoCancellation: true } });
            currentCall = peer.call(tid, localStream);
            currentCall.on('stream', s => { const a = new Audio(); a.srcObject = s; a.play(); });
        }

        async function answerCall(call) {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            call.answer(localStream);
            call.on('stream', s => { const a = new Audio(); a.srcObject = s; a.play(); });
        }

        // --- VISUALIZER ENGINE ---
        function startVisualizer(stream) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            source.connect(analyser);
            
            const canvas = document.getElementById('v-canvas');
            const ctx = canvas.getContext('2d');
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            canvas.style.display = "block";

            function draw() {
                animationId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ffcc';
                let barWidth = (canvas.width / dataArray.length) * 2.5;
                let x = 0;
                for(let i = 0; i < dataArray.length; i++) {
                    let barHeight = dataArray[i] / 2;
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }
            draw();
        }

        // --- VOICE NOTE LOGIC ---
        async function startRec() {
            const s = await navigator.mediaDevices.getUserMedia({ audio: true });
            startVisualizer(s);
            rec = new MediaRecorder(s);
            chunks = [];
            rec.ondataavailable = e => chunks.push(e.data);
            rec.onstop = () => {
                const b = new Blob(chunks, { type: 'audio/webm' });
                audioData = URL.createObjectURL(b);
                previewAudio.src = audioData;
                showUI('preview');
                cancelAnimationFrame(animationId);
                document.getElementById('v-canvas').style.display = "none";
                s.getTracks().forEach(t => t.stop());
            };
            rec.start();
            showUI('recording');
            startTimer();
        }

        function togglePauseRec() {
            if(rec.state === "recording") { rec.pause(); clearInterval(timerInt); }
            else { rec.resume(); startTimer(); }
        }

        function stopRec() { rec.stop(); clearInterval(timerInt); }

        function togglePreviewPlay() {
            const btn = document.getElementById('preview-play-btn');
            if(previewAudio.paused) { previewAudio.play(); btn.innerText = "PAUSE PREVIEW"; }
            else { previewAudio.pause(); btn.innerText = "PLAY PREVIEW"; }
        }

        function renderAudioMsg(sender, url) {
            const id = "a" + Math.random().toString(36).substr(2, 5);
            log(sender, `<div class="audio-player"><button class="play-btn" id="b_${id}" onclick="togglePlay('${id}')">PLAY</button><audio id="${id}" src="${url}"></audio></div>`);
        }

        function togglePlay(id) {
            const a = document.getElementById(id);
            const b = document.getElementById('b_'+id);
            if(a.paused) { a.play(); b.innerText = "PAUSE"; }
            else { a.pause(); b.innerText = "PLAY"; }
            a.onended = () => b.innerText = "PLAY";
        }

        function startTimer() {
            timerInt = setInterval(() => {
                seconds++;
                let m = Math.floor(seconds/60).toString().padStart(2,'0');
                let s = (seconds%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${m}:${s}`;
                if(seconds >= 60) stopRec();
            }, 1000);
        }

        function showUI(state) {
            document.getElementById('v-start-btn').style.display = state === 'start' ? 'block' : 'none';
            document.getElementById('rec-controls').style.display = state === 'recording' ? 'flex' : 'none';
            document.getElementById('timer').style.display = state === 'recording' ? 'block' : 'none';
            document.getElementById('preview-box').style.display = state === 'preview' ? 'flex' : 'none';
        }

        function resetRec() { seconds = 0; audioData = null; showUI('start'); document.getElementById('timer').innerText = "00:00"; }
        
        async function sendVoice() {
            const b = await fetch(audioData).then(r => r.blob());
            const f = new FileReader();
            f.onload = () => { broadcast({t:'voc', v:f.result, n:myName}); renderAudioMsg("ME", f.result); resetRec(); };
            f.readAsDataURL(b);
        }

        function log(n, m) { const b = document.getElementById('chat-box'); b.innerHTML += `<div class="msg"><span class="u-tag">[${n}]</span> ${m}</div>`; b.scrollTop = b.scrollHeight; }
        function sendText() { const v = document.getElementById('m-in').value; if(v){ broadcast({t:'txt',v:v,n:myName}); log("ME",v); document.getElementById('m-in').value=""; }}
        function broadcast(d) { conns.forEach(c => c.open && c.send(d)); }
        function connectToPeer() { const id = document.getElementById('target').value.toUpperCase(); if(id) setup(peer.connect(id)); }
    </script>
</body>
</html>
