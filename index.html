<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHANTOM MESH v12</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --glow: #00ffcc; --red: #ff4444; --bg: #000; --panel: #111; --blue: #5d5df5; --grey: #222; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { height: 100svh; background: var(--bg); color: #ccc; display: flex; flex-direction: column; overflow: hidden; }

        /* Header & Info */
        #header { padding: 12px; background: #0a0a0a; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
        .dot { height: 8px; width: 8px; border-radius: 50%; background: #444; margin-right: 6px; display: inline-block; }
        .online { background: var(--glow); box-shadow: 0 0 8px var(--glow); }

        /* Chat Layout */
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: radial-gradient(circle at center, #050505 0%, #000 100%); }
        
        .msg { 
            max-width: 75%; 
            padding: 10px 12px; 
            border-radius: 12px; 
            font-size: 0.9rem; 
            line-height: 1.4;
            position: relative;
            word-break: break-word; /* Fixes text overflow */
            overflow-wrap: anywhere;
            border: 1px solid #1a1a1a;
        }

        .msg.me { 
            align-self: flex-end; 
            background: #1a1a1a; 
            border-bottom-right-radius: 2px;
            color: #fff;
        }

        .msg.them { 
            align-self: flex-start; 
            background: #0a0a0a; 
            border-bottom-left-radius: 2px;
            border-left: 3px solid var(--glow);
        }

        .sender-tag { font-size: 0.65rem; color: var(--glow); font-weight: bold; margin-bottom: 3px; display: block; }
        .tick { font-size: 0.7rem; color: #555; float: right; margin: 4px 0 0 8px; font-weight: bold; }
        .delivered { color: var(--glow) !important; }

        /* Call Screen */
        #call-ui { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        #call-timer { font-family: monospace; font-size: 1.5rem; color: var(--glow); margin: 10px 0; }

        /* Controls */
        .controls { padding: 10px; background: #080808; border-top: 1px solid #1a1a1a; display: flex; flex-direction: column; gap: 8px; }
        .row { display: flex; gap: 8px; }
        input { flex: 1; background: #111; border: 1px solid #222; color: #fff; padding: 12px; border-radius: 8px; outline: none; font-size: 0.9rem; }
        button { background: #111; border: 1px solid var(--glow); color: var(--glow); padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Voice Waveform Animation */
        #v-area { display: none; background: #0a0a0a; padding: 15px; border-radius: 10px; flex-direction: column; align-items: center; border: 1px solid #222; }
        .wave-container { display: flex; align-items: center; gap: 3px; height: 30px; margin-bottom: 10px; }
        .bar { width: 3px; height: 100%; background: var(--glow); border-radius: 2px; animation: pulse 0.8s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { height: 10%; } 50% { height: 100%; } }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }

        #prompt-ui { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="prompt-ui">
        <h2 style="color:var(--glow); margin-bottom:20px;">PHANTOM IDENTITY</h2>
        <input type="text" id="name-input" placeholder="Enter Codename" style="max-width:250px; text-align:center;">
        <button onclick="saveIdentity()" style="margin-top:20px; width:250px;">JOIN MESH</button>
    </div>

    <div id="call-ui">
        <div id="call-status" style="color:var(--blue); font-size: 1.2rem;">DIALING...</div>
        <div id="call-timer">00:00</div>
        <div class="row" style="margin-top:40px;">
            <button id="ans-btn" style="background:var(--glow); color:#000; padding:15px 30px; display:none" onclick="acceptCall()">ANSWER</button>
            <button style="background:var(--red); color:#fff; border:none; padding:15px 30px;" onclick="endCall()">HANG UP</button>
        </div>
    </div>

    <div id="header">
        <div><span id="status-dot" class="dot"></span> <span id="display-name">...</span></div>
        <div id="my-id-label">SYNCING...</div>
    </div>

    <div id="chat-box"></div>

    <div class="controls">
        <div class="row">
            <input type="text" id="target" placeholder="Peer ID">
            <button id="link-btn" onclick="connect()">LINK</button>
        </div>
        <div class="row">
            <input type="text" id="m-in" placeholder="Message...">
            <button onclick="sendTxt()">SEND</button>
        </div>
        <div class="row">
            <button onclick="startCall()" style="flex:1; color:var(--blue); border-color:var(--blue)">HD CALL</button>
            <button id="vn-trigger" onclick="startVN()" style="flex:1">VOICE NOTE</button>
        </div>

        <div id="v-area">
            <div class="wave-container">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <div id="v-timer" style="color:var(--red); font-weight:bold; margin-bottom:10px;">00:00</div>
            <div class="row">
                <button onclick="pauseRec()" id="p-btn">PAUSE</button>
                <button onclick="stopRec()" style="background:var(--red); border:none; color:#fff">FINISH</button>
            </div>
        </div>

        <div id="v-preview" style="display:none" class="row">
            <button onclick="playPreview()" id="pre-btn" style="flex:1">PLAY</button>
            <button onclick="sendVN()" style="background:var(--glow); color:#000; border:none; flex:2">SEND VN</button>
            <button onclick="cancelVN()">X</button>
        </div>
    </div>

    <script>
        let peer, conns = {}, myName, myId, localStream, curCall, rec, chunks = [], audioBlobUrl, 
            vnTimer, vnSec = 0, callTimer, callSec = 0;
        const previewAud = new Audio();

        function saveIdentity() {
            const n = document.getElementById('name-input').value.trim();
            if(!n) return;
            myName = n;
            localStorage.setItem('mesh_name', n);
            document.getElementById('prompt-ui').style.display='none';
            init();
        }

        function init() {
            myId = localStorage.getItem('mesh_id') || Math.random().toString(36).substr(2,6).toUpperCase();
            localStorage.setItem('mesh_id', myId);
            peer = new Peer(myId);
            peer.on('open', id => { 
                document.getElementById('my-id-label').innerText = "ID: " + id; 
                document.getElementById('display-name').innerText = myName;
            });
            peer.on('connection', c => setup(c));
            peer.on('call', call => {
                curCall = call;
                vibrate([400, 200, 400]);
                document.getElementById('call-ui').style.display='flex';
                document.getElementById('ans-btn').style.display='block';
                document.getElementById('call-status').innerText = "INCOMING...";
            });
        }

        function connect() {
            const tid = document.getElementById('target').value.toUpperCase();
            if(tid) {
                document.getElementById('link-btn').innerText = "...";
                setup(peer.connect(tid, {metadata: {name: myName}}));
            }
        }

        function setup(c) {
            c.on('open', () => {
                conns[c.peer] = c;
                document.getElementById('link-btn').innerText = "LINKED";
                document.getElementById('status-dot').classList.add('online');
                vibrate(100);
            });
            c.on('data', d => {
                if(d.type === 'txt') { render(d.sender, d.body, d.id, false); c.send({type:'ack', id:d.id}); vibrate(100); }
                if(d.type === 'ack') { const t = document.getElementById('tk-'+d.id); if(t) t.innerText='✓✓', t.classList.add('delivered'); }
                if(d.type === 'voc') { renderVoc(d.sender, d.body, d.id, false); c.send({type:'ack', id:d.id}); vibrate(100); }
                if(d.type === 'end') resetCallUI();
            });
        }

        // --- CHAT LOGIC ---
        function sendTxt() {
            const v = document.getElementById('m-in').value;
            if(!v) return;
            const id = Date.now();
            for(let k in conns) conns[k].send({type:'txt', body:v, sender:myName, id:id});
            render('ME', v, id, true);
            document.getElementById('m-in').value = "";
        }

        function render(s, b, id, me) {
            const box = document.getElementById('chat-box');
            const tick = me ? `<span class="tick" id="tk-${id}">✓</span>` : '';
            const cls = me ? 'me' : 'them';
            box.innerHTML += `<div class="msg ${cls}"><span class="sender-tag">${s}</span>${b}${tick}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        // --- VOICE NOTES ---
        async function startVN() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            rec = new MediaRecorder(stream);
            chunks = [];
            rec.ondataavailable = e => chunks.push(e.data);
            rec.onstop = () => {
                audioBlobUrl = URL.createObjectURL(new Blob(chunks, {type:'audio/webm'}));
                previewAud.src = audioBlobUrl;
                document.getElementById('v-area').style.display = 'none';
                document.getElementById('v-preview').style.display = 'flex';
                stream.getTracks().forEach(t=>t.stop());
            };
            rec.start();
            vnSec = 0;
            document.getElementById('v-area').style.display = 'flex';
            vnTimer = setInterval(() => { vnSec++; document.getElementById('v-timer').innerText = `00:${vnSec.toString().padStart(2,'0')}`; if(vnSec>=60) stopRec(); }, 1000);
        }

        function stopRec() { rec.stop(); clearInterval(vnTimer); }
        function pauseRec() { rec.state === 'recording' ? (rec.pause(), clearInterval(vnTimer)) : (rec.resume(), startVNRefill()); }
        function startVNRefill() { vnTimer = setInterval(() => { vnSec++; document.getElementById('v-timer').innerText = `00:${vnSec.toString().padStart(2,'0')}`; }, 1000); }

        async function sendVN() {
            const reader = new FileReader();
            const blob = await fetch(audioBlobUrl).then(r=>r.blob());
            reader.onload = () => {
                const id = Date.now();
                for(let k in conns) conns[k].send({type:'voc', body:reader.result, sender:myName, id:id});
                renderVoc('ME', reader.result, id, true);
                cancelVN();
            };
            reader.readAsDataURL(blob);
        }

        function renderVoc(s, b, id, me) {
            const html = `<button onclick="playV('${id}')" id="btn-${id}">PLAY VN</button><audio id="aud-${id}" src="${b}"></audio>`;
            render(s, html, id, me);
        }

        window.playV = (id) => {
            const a = document.getElementById('aud-'+id), b = document.getElementById('btn-'+id);
            a.paused ? (a.play(), b.innerText='PAUSE') : (a.pause(), b.innerText='PLAY VN');
            a.onended = () => b.innerText='PLAY VN';
        };

        function cancelVN() { document.getElementById('v-preview').style.display='none'; }
        function playPreview() { previewAud.paused ? previewAud.play() : previewAud.pause(); }

        // --- CALLS & CALL TIMER ---
        async function startCall() {
            const tid = document.getElementById('target').value.toUpperCase();
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            document.getElementById('call-ui').style.display='flex';
            curCall = peer.call(tid, localStream, {metadata: {name: myName}});
            curCall.on('stream', s => { beginCallTimer(); playS(s); });
        }

        function acceptCall() {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(s => {
                localStream = s; curCall.answer(s);
                document.getElementById('ans-btn').style.display='none';
                beginCallTimer();
                curCall.on('stream', rs => playS(rs));
            });
        }

        function beginCallTimer() {
            document.getElementById('call-status').innerText = "CONNECTED";
            callSec = 0;
            clearInterval(callTimer);
            callTimer = setInterval(() => {
                callSec++;
                let m = Math.floor(callSec / 60).toString().padStart(2,'0');
                let s = (callSec % 60).toString().padStart(2,'0');
                document.getElementById('call-timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function endCall() {
            for(let k in conns) conns[k].send({type:'end'});
            resetCallUI();
        }

        function resetCallUI() {
            clearInterval(callTimer);
            if(curCall) curCall.close();
            if(localStream) localStream.getTracks().forEach(t=>t.stop());
            document.getElementById('call-ui').style.display='none';
            document.getElementById('call-timer').innerText = "00:00";
        }

        function playS(s) { const a = new Audio(); a.srcObject=s; a.play(); }
        function vibrate(p) { if(navigator.vibrate) navigator.vibrate(p); }
    </script>
</body>
</html>
