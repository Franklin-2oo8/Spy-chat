<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System 404</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --glow: #00ffcc; --red: #ff4444; --bg: #050505; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { height: 100vh; background: #000; color: #444; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; }
        
        #fake-ui { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #secret-ui { display: none; flex-direction: column; height: 100vh; padding: 5px; background: var(--bg); }

        /* Compact Status */
        #status-bar { font-size: 0.6rem; padding: 2px 5px; color: #555; border-bottom: 1px solid #111; display: flex; justify-content: space-between; }
        .online { color: var(--glow); font-weight: bold; }

        /* Flexible Chat Box - Shrinks to fit */
        #chat-box { flex: 1; overflow-y: auto; border-left: 2px solid var(--glow); padding: 5px; font-size: 0.75rem; background: #000; margin-bottom: 5px; min-height: 100px; }
        .msg { margin-bottom: 4px; border-bottom: 1px solid #080808; padding-bottom: 2px; color: #bbb; }
        .u-tag { color: var(--glow); font-weight: bold; }

        /* Tightened Rows */
        .row { display: flex; gap: 3px; margin-bottom: 4px; height: 38px; }
        input { flex: 1; background: #111; border: 1px solid #222; color: white; padding: 0 8px; font-size: 0.8rem; border-radius: 4px; outline: none; }
        button { background: #111; border: 1px solid var(--glow); color: var(--glow); padding: 0 10px; font-weight: bold; border-radius: 4px; font-size: 0.65rem; }

        /* Condensed Grid */
        .haptic-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; margin-bottom: 5px; height: 35px; }
        
        /* Optimized Recording Area */
        #v-area { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 6px; position: relative; height: 45px; display: flex; align-items: center; justify-content: center; }
        #v-btn { width: 100%; color: var(--red); border-color: var(--red); height: 100%; font-size: 0.7rem; }
        
        #countdown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; color: var(--red); background: rgba(0,0,0,0.95); z-index: 10; }

        .preview-box { display: none; gap: 3px; width: 100%; height: 100%; }
        .preview-box button { flex: 1; height: 100%; }

        #id-tag { font-size: 0.55rem; text-align: center; color: #222; padding: 3px 0; }
        .panic { position: fixed; top: 0; left: 0; width: 100%; height: 30px; z-index: 999; }
    </style>
</head>
<body>

    <div id="fake-ui" onclick="unlock()">
        <h1>404</h1>
        <p>Resource Error</p>
    </div>

    <div id="secret-ui">
        <div class="panic" onclick="location.reload()"></div>
        
        <div id="status-bar">
            <span>NET: <span id="p-status">OFFLINE</span></span>
            <span id="p-name" style="color:#333">PHANTOM_v5.2</span>
        </div>

        <div id="chat-box">-- INTERFACE INITIALIZED --</div>

        <div class="row">
            <input type="text" id="target" placeholder="6-digit ID">
            <button onclick="connectToPeer()">LINK</button>
        </div>

        <div class="row">
            <input type="text" id="m-in" placeholder="Text...">
            <button onclick="sendText()">SEND</button>
        </div>

        <div class="haptic-grid">
            <button onclick="sendHap('yes')">YES</button>
            <button onclick="sendHap('no')">NO</button>
            <button onclick="sendHap('alert')" style="color:var(--red);border-color:var(--red);">!!!</button>
        </div>

        <div id="v-area">
            <button id="v-btn" onclick="startRec()">TAP TO RECORD (5s)</button>
            <div id="countdown-overlay">5</div>
            <div id="preview-box" class="preview-box">
                <button onclick="playLocal()" style="color:#fff;">PLAY</button>
                <button onclick="sendVoice()" style="background:var(--glow); color:black; border:none;">SEND</button>
                <button onclick="resetRec()" style="color:#444; border-color:#222;">X</button>
            </div>
        </div>

        <div id="id-tag">ID: <span id="my-id">...</span></div>
    </div>

    <script>
        // ... (The Logic remains the same as v5.1 Part 2 provided earlier)
        // Ensure you paste the JavaScript logic from the previous message here!
        
    let peer, conns = [], myName = "", audioData = null, rec, chunks = [], clicks = 0;
    const hapLib = { 'yes': [200, 100, 200], 'no': [500], 'alert': [100, 50, 100, 50, 100, 50, 500] };
    const shortID = Math.random().toString(36).substring(2, 8).toUpperCase();

    function unlock() {
        if (++clicks >= 3) {
            navigator.vibrate([50, 50, 50]); 
            myName = prompt("Code Name:") || "Ghost";
            document.getElementById('fake-ui').style.display = 'none';
            document.getElementById('secret-ui').style.display = 'flex';
            initPeer();
        }
    }

    function initPeer() {
        peer = new Peer(shortID, { config: {'iceServers': [{url:'stun:stun.l.google.com:19302'}]} });
        peer.on('open', id => document.getElementById('my-id').innerText = id);
        peer.on('connection', c => setup(c));
        setInterval(() => {
            const isOnline = conns.some(c => c.open);
            const el = document.getElementById('p-status');
            el.innerText = isOnline ? "ONLINE" : "OFFLINE";
            el.className = isOnline ? "online" : "";
        }, 3000);
    }

    function connectToPeer() {
        const id = document.getElementById('target').value.toUpperCase();
        if(id) setup(peer.connect(id));
    }

    function setup(c) {
        c.on('open', () => { conns.push(c); log("SYSTEM", "SECURE TUNNEL OPEN"); });
        c.on('data', d => {
            if (d.t === 'txt') log(d.n, d.v);
            if (d.t === 'hap') { navigator.vibrate(hapLib[d.v]); log(d.n, `[Haptic: ${d.v}]`); }
            if (d.t === 'voc') {
                const audId = "aud_" + Date.now();
                log(d.n, `Voice Note <div class="audio-msg"><button onclick="playReceived('${audId}')">PLAY AUDIO</button></div><audio id="${audId}" src="${d.v}"></audio>`);
            }
        });
    }

    function log(n, m) {
        const b = document.getElementById('chat-box');
        b.innerHTML += `<div class="msg"><span class="u-tag">[${n}]</span> ${m}</div>`;
        b.scrollTop = b.scrollHeight;
    }

    function sendText() {
        const val = document.getElementById('m-in').value;
        if(!val) return;
        broadcast({t:'txt', v:val, n:myName});
        log("ME", val);
        document.getElementById('m-in').value = "";
    }

    function sendHap(type) {
        broadcast({t:'hap', v:type, n:myName});
        navigator.vibrate(hapLib[type]);
    }

    async function startRec() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(stream);
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 2.5; // BOOST VOLUME
            const destination = audioCtx.createMediaStreamDestination();
            source.connect(gainNode);
            gainNode.connect(destination);
            rec = new MediaRecorder(destination.stream, { mimeType: 'audio/webm', audioBitsPerSecond: 64000 });
            chunks = [];
            rec.ondataavailable = e => chunks.push(e.data);
            rec.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const r = new FileReader();
                r.onload = () => {
                    audioData = r.result;
                    document.getElementById('v-btn').style.display = "none";
                    document.getElementById('countdown-overlay').style.display = "none";
                    document.getElementById('preview-box').style.display = "flex";
                };
                r.readAsDataURL(blob);
                stream.getTracks().forEach(track => track.stop());
            };
            rec.start();
            const overlay = document.getElementById('countdown-overlay');
            overlay.style.display = "flex";
            let timeLeft = 5;
            overlay.innerText = timeLeft;
            const timerInterval = setInterval(() => {
                timeLeft--;
                overlay.innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if(rec.state === "recording") rec.stop();
                }
            }, 1000);
        } catch(e) { log("SYSTEM", "Mic Error"); }
    }

    function playLocal() { if(audioData) new Audio(audioData).play(); }
    function playReceived(id) { document.getElementById(id).play(); }
    function sendVoice() { broadcast({t:'voc', v:audioData, n:myName}); log("ME", "[Voice Sent]"); resetRec(); }
    function resetRec() { audioData = null; document.getElementById('v-btn').style.display = "block"; document.getElementById('preview-box').style.display = "none"; document.getElementById('countdown-overlay').style.display = "none"; }
    function broadcast(d) { conns.forEach(c => { if(c.open) c.send(d); }); }
    </script>
</body>
</html>
